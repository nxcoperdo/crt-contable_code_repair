<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#080B11" id="meta-tema">
<title>Contable · Code Repair Tech</title>
<script src="/tema.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contable">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="entrada" class="entrada" hidden>
  <div class="entrada-caja">
    <div class="marca">
      <span class="wordmark"><span class="wm-code">Code</span><span class="wm-repair">Repair</span><span class="wm-tech">Tech</span></span>
    </div>
    <p class="entrada-texto">Contable · qué entra, qué sale y qué queda.</p>
    <label class="campo"><span>Usuario</span><input id="in-usuario" autocomplete="username" autocapitalize="none"></label>
    <label class="campo"><span>Clave</span><input id="in-clave" type="password" autocomplete="current-password"></label>
    <button class="btn btn-principal" id="btn-entrar">Entrar</button>
    <p class="error" id="entrada-error" hidden></p>
  </div>
</div>

<div id="app" hidden>
  <header class="barra">
    <div class="marca">
      <span class="wordmark"><span class="wm-code">Code</span><span class="wm-repair">Repair</span><span class="wm-tech">Tech</span></span>
      <span class="marca-nombre">Contable</span>
    </div>
    <div class="barra-acciones">
      <button class="btn btn-texto btn-icono" id="btn-instalar" hidden aria-label="Instalar app" title="Instalar app">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="btn btn-texto btn-icono" id="btn-tema" aria-label="Cambiar tema" title="Tema claro / oscuro">
        <svg class="ico-sol" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-luna" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <button class="btn btn-texto" id="btn-cuenta">Cuenta</button>
      <button class="btn btn-texto" id="btn-salir">Salir</button>
    </div>
  </header>

  <nav class="navegacion" id="nav"></nav>
  <div id="offline" class="offline" hidden>Sin conexión — necesitas internet para ver tus datos</div>

  <main id="vista" class="vista"></main>

  <div class="acciones-fijas">
    <button class="btn btn-ingreso" data-nuevo="ingresos">Registrar ingreso</button>
    <button class="btn btn-gasto" data-nuevo="gastos">Registrar gasto</button>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-caja" role="dialog" aria-modal="true">
    <div class="modal-titulo">
      <h2 id="modal-titulo">Registro</h2>
      <button class="btn btn-texto" id="modal-cerrar" aria-label="Cerrar">Cerrar</button>
    </div>
    <div id="modal-campos" class="modal-campos"></div>
    <p class="error" id="modal-error" hidden></p>
    <div class="modal-pie">
      <button class="btn btn-principal" id="modal-guardar">Guardar</button>
    </div>
  </div>
</div>

<div id="aviso" class="aviso" hidden></div>

<script src="/app.js"></script>
</body>
</html>
